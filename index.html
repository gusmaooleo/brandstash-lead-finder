<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="/public/favicon-lead-finder.svg" type="image/svg+xml">
    <title>Brandstash Lead Finder</title>
    <script>
      // Apply the persisted theme before first paint (no flash).
      try {
        if (localStorage.getItem('bs-theme') === 'light') document.documentElement.classList.add('light')
      } catch {}
    </script>
    <style>
      html { background: #0a0a0b; }
      html.light { background: #fbfbfa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
